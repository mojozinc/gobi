services:
  postgres:
    image: postgres:15-alpine
    container_name: gobi-postgres
    environment:
      POSTGRES_USER: gobi
      POSTGRES_PASSWORD: gobi_password
      POSTGRES_DB: gobi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobi -d gobi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: gobi-backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql+asyncpg://gobi:gobi_password@postgres:5432/gobi_db
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRY_HOURS: 72
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TEXT_MODEL: ${OPENROUTER_TEXT_MODEL:-meta-llama/llama-3.3-70b-instruct}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-3.8-flash}
    volumes:
      - .:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile

volumes:
  postgres_data:
