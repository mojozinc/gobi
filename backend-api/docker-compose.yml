version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gobi-postgres
    environment:
      POSTGRES_USER: gobi
      POSTGRES_PASSWORD: gobi_password
      POSTGRES_DB: gobi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobi -d gobi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: gobi-backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENV: development
      DATABASE_URL: postgresql+asyncpg://gobi:gobi_password@postgres:5432/gobi_db
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRY_HOURS: 72
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TEXT_MODEL: ${OPENROUTER_TEXT_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.0-flash-exp:free}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
