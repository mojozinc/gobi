version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gobi-postgres
    environment:
      POSTGRES_USER: gobi
      POSTGRES_PASSWORD: gobi_password
      POSTGRES_DB: gobi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: gobi-backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: gobi
      DB_PASSWORD: gobi_password
      DB_NAME: gobi_db
      DB_SSLMODE: disable
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRY_HOURS: 72
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
